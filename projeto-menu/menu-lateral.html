<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu de navegação</title>
    <link rel="stylesheet" href="style.css"/>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background-color: #f3f4f6;
      }
      .cabecalho {
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        padding: 32px 16px;
        background-color: #173f5f;
        color: white;
      }
      .logo {
        display: inline-block;
        margin-bottom: 24px;
        color: white;
        font-size: 1.4rem;
        font-weight: bold;
        text-decoration: none;
      }
      .navegacao ul {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }
      .navegacao a {
        display: block;
        padding: 12px 14px;
        border-radius: 6px;
        color: white;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }
      .navegacao a:hover {
        background-color: #2f80a8;
      }
      main {
        margin-left: 240px;
      }
      .secao {
        min-height: 70vh;
        padding:  64px 32px;
      }
      .secao h1,
      .secao h2 {
        color: #173f5f;
      }
    </style>
  </head>
  <body>
    <header class="cabecalho">
      <a class="logo" href="#inicio">EstudaWeb</a>
      <nav class="navegacao" aria-label="Navegação principal">
        <ul>
          <li><a href="#inicio">Início</a></li>
          <li><a href="#aulas">Aulas</a></li>
          <li><a href="#projetos">Projetos</a></li>
          <li><a href="#sobre">Sobre</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="inicio" class="secao">
        <h1>Aprenda programação front-end</h1>
        <p>Esta é a área inicial da nossa página.</p>
      </section>
      <section id="aulas" class="secao">
        <h2>Aulas</h2>
        <p>Aqui ficarão os conteúdos da disciplina.</p>
      </section>
      <section id="projetos" class="secao">
        <h2>Projetos</h2>
        <p>Aqui serão apresentados os projetos dos alunos.</p>
      </section>
      <section id="sobre" class="secao">
        <h2>Sobre</h2>
        <p>Esta página foi criada durante uma aula de front-end.</p>
      </section>
    </main>
  </body>
</html>
